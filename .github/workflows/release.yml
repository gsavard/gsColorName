name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: pytest -q tests

  linux:
    needs: tests
    # Ubuntu 22.04 (glibc 2.35) : binaires compatibles avec Debian 12+, Ubuntu 22.04+, Fedora 36+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Outils de paquetage
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Construire .deb et .rpm
        run: packaging/linux/build-packages.sh deb rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Construire l'installateur
        shell: pwsh
        run: packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe

  macos:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (arm64)
          - runner: macos-15-intel    # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Construire .app et .dmg
        run: packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Sommes de contrôle
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
